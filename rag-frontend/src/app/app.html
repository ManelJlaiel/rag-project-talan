@if (!authService.estConnecte()) {

  <div class="ecran-connexion">
    <div class="carte-connexion">
      <span class="logo-connexion">◆</span>
      <h1>Assistant Documentaire IA</h1>
      <p class="sous-titre-connexion">RAG multi-fonctionnel</p>
      <button class="bouton-connexion" (click)="seConnecter()">Se connecter</button>
    </div>
  </div>

} @else {

  <div class="app-shell">

    <header class="entete">
      <div class="entete-marque">
        <span class="entete-logo">◆</span>
        <div>
          <h1>Assistant Documentaire IA</h1>
          <p class="sous-titre"> RAG multi-fonctionnel</p>
        </div>
      </div>

      <div class="entete-droite">
        <nav class="onglets">
          <button
            class="onglet"
            [class.actif]="ongletActif() === 'pdf'"
            (click)="changerOnglet('pdf')">
            Questions sur PDF
          </button>
          <button
            class="onglet"
            [class.actif]="ongletActif() === 'code'"
            (click)="changerOnglet('code')">
            Code Explainer
          </button>
        </nav>

        <div class="zone-utilisateur">
          <span class="nom-utilisateur">{{ authService.nomUtilisateur() }}</span>
          <button class="bouton-deconnexion" (click)="seDeconnecter()">Déconnexion</button>
        </div>
      </div>
    </header>

    <main class="contenu">
      @if (ongletActif() === 'pdf') {
        <app-pdf-qa />
      } @else {
        <app-code-explainer />
      }
    </main>

  </div>

}
