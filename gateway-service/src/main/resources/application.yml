server:
  port: 8082

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/talan-stage
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            - id: pdf-rag-service
              uri: http://localhost:8000
              predicates:
                - Path=/api/pdf/**
              filters:
                - StripPrefix=2

            - id: code-explainer-service
              uri: http://localhost:8001
              predicates:
                - Path=/api/code/**
              filters:
                - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,gateway